name: Publier une version
# Se lance :
#  - quand la version change dans app/package.json sur main (crée la Release vX.Y.Z toute seule) ;
#  - quand une Release est publiée à la main sur GitHub ;
#  - à la main (Actions → Run workflow) : construit l'installateur sans publier.
on:
  push:
    branches: [main]
    paths: [app/package.json]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${GITHUB_REF_NAME#v}"; GO=true
          else
            V=$(node -p "require('./app/package.json').version")
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then GO=true
            elif gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then GO=false
            else GO=true; fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "Version $V, publier : $GO"
  windows:
    needs: prep
    if: needs.prep.outputs.go == 'true'
    runs-on: windows-latest
    concurrency:
      group: release-v${{ needs.prep.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version de l'appli
        shell: bash
        run: |
          V="${{ needs.prep.outputs.version }}"
          node -e "const f='app/package.json';const p=require('./'+f);p.version='$V';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - run: python tools/build.py
      - run: npm install
      - name: Dépendances de l'appli (mise à jour auto)
        run: npm install --prefix app --omit=dev --no-package-lock
      - name: Installateur Windows
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'workflow_dispatch'
        with:
          tag_name: v${{ needs.prep.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ZKX ${{ needs.prep.outputs.version }}
          body_path: CHANGELOG-release.md
          make_latest: true
          files: |
            dist/ZKX-Setup-*.exe
            dist/ZKX-Setup-*.exe.blockmap
            dist/latest.yml
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ZKX-Setup
          path: dist/ZKX-Setup-*.exe
