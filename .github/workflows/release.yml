name: Publier une version
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version de l'appli = tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f='app/package.json';const p=require('./'+f);p.version='$V';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - run: python tools/build.py
      - run: npm install
      - name: Dépendances de l'appli (mise à jour auto)
        run: npm install --prefix app --omit=dev --no-package-lock
      - name: Installateur Windows
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            dist/ZKX-Setup-*.exe
            dist/ZKX-Setup-*.exe.blockmap
            dist/latest.yml
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: ZKX-Setup
          path: dist/ZKX-Setup-*.exe
