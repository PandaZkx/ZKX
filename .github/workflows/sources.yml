name: Récupérer les sources (diagnostic)
on:
  push:
    branches: [main]
    paths: [.github/workflows/sources.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        shell: bash
        run: |
          mkdir -p data/_src
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          for u in "https://e7rtabot.com/stats" "https://e7rtabot.com/" "https://epic7db.com/heroes"; do
            f="data/_src/$(echo "$u" | sed 's#https://##; s#[/?=&]#_#g').html"
            curl -sSL -A "$UA" --max-time 60 "$u" -o "$f" || echo "échec $u" >> data/_src/log.txt
            echo "$u -> $(wc -c < "$f" 2>/dev/null) octets" >> data/_src/log.txt
          done
          # liens vers des JSON / API dans les pages
          grep -hoE '(https?:)?//[^"'"'"' )]+\.(json|js)' data/_src/*.html | sort -u | head -80 > data/_src/links.txt || true
          grep -hoE '"/(api|_next|static)[^"]+"' data/_src/*.html | sort -u | head -80 >> data/_src/links.txt || true
      - name: Enregistrer
        shell: bash
        run: |
          git config user.name "zkx-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_src && git commit -m "Sources : récupération pour diagnostic" && git pull --rebase origin main && git push || echo rien
